<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rapoarte SSM</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#f4f3ef;--surface:#fff;--surface2:#f9f8f5;--border:#dddbd4;
  --border-strong:#b8b5ac;--text:#1a1917;--text-muted:#6b6860;
  --text-faint:#9b9890;--accent:#1a4d8f;--accent-light:#e8eef7;
  --accent-dark:#0f3060;--yes:#1a6b3c;--yes-bg:#eaf5ee;
  --danger:#c0392b;--radius:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh;}html,body{height:100%;}

/* ── LOGIN ── */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:40px 36px;width:100%;max-width:360px;box-shadow:0 4px 24px rgba(0,0,0,0.08);}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
.login-logo-icon{width:40px;height:40px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;}
.login-logo-icon svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.login-title{font-size:18px;font-weight:600;color:var(--text);}
.login-sub{font-size:12px;color:var(--text-faint);margin-top:2px;}
.login-label{display:block;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;}
.login-input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);font-family:inherit;font-size:14px;color:var(--text);outline:none;transition:border-color 0.15s;}
.login-input:focus{border-color:var(--accent);}
.login-btn{width:100%;margin-top:16px;padding:11px;background:var(--accent);border:none;border-radius:var(--radius);color:#fff;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:background 0.15s;}
.login-btn:hover{background:var(--accent-dark);}
.login-btn:disabled{opacity:0.6;cursor:not-allowed;}
.login-error{margin-top:12px;padding:10px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius);font-size:13px;color:var(--danger);display:none;}

/* ── APP ── */
#appScreen{display:none;flex-direction:column;height:100vh;}
.topbar{background:var(--accent);color:#fff;padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.15);}
.topbar-left{display:flex;align-items:center;gap:10px;}
.topbar-icon{width:28px;height:28px;background:rgba(255,255,255,0.15);border-radius:7px;display:flex;align-items:center;justify-content:center;}
.topbar-icon svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.topbar-title{font-size:15px;font-weight:600;letter-spacing:-0.2px;}
.topbar-sub{font-size:11px;opacity:0.6;margin-top:1px;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.status-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.12);border-radius:20px;padding:4px 12px;font-size:11px;}
.status-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;}
.status-dot.loading{background:#fbbf24;animation:pulse 1s infinite;}
.status-dot.error{background:#f87171;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.logout-btn{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:var(--radius);border:1px solid rgba(255,255,255,0.3);background:transparent;color:#fff;font-family:inherit;font-size:12px;cursor:pointer;transition:background 0.1s;}
.logout-btn:hover{background:rgba(255,255,255,0.1);}
.logout-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* ── TABS ── */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;flex-shrink:0;overflow-x:auto;}
.tab{padding:10px 18px;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:color 0.15s,border-color 0.15s;display:flex;align-items:center;gap:6px;margin-bottom:-1px;white-space:nowrap;}
.tab svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-content{display:none !important;position:absolute;top:0;left:0;right:0;bottom:0;}
.tab-content.active{display:flex !important;position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;}

/* ── MAIN LAYOUT ── */
.main{position:relative;flex:1;min-height:0;overflow:hidden;}
.rapoarte-layout{width:100%;height:100%;display:flex;overflow:hidden;flex:1;min-height:0;}

/* ── ZOOM ── */
.btn-icon{padding:5px 8px;min-width:32px;justify-content:center;font-size:14px;font-weight:600;}
.zoom-level{font-size:11px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;min-width:36px;text-align:center;}
.toolbar-divider{width:1px;height:20px;background:var(--border);margin:0 2px;flex-shrink:0;}

/* ── SIDEBAR ── */
.sidebar{width:340px;flex-shrink:0;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);overflow:hidden;}
.sidebar-toolbar{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
.search-wrap{position:relative;}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--text-faint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}
.search-input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);font-family:inherit;font-size:13px;color:var(--text);outline:none;transition:border-color 0.15s;}
.search-input:focus{border-color:var(--accent);}
.toolbar-row{display:flex;gap:8px;align-items:center;}
.sort-select{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);font-family:inherit;font-size:12px;color:var(--text-muted);outline:none;cursor:pointer;}
.count-badge{font-size:11px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
.file-list{flex:1;overflow-y:auto;padding:8px;}
.file-list::-webkit-scrollbar{width:10px;}
.file-list::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}
.file-list::-webkit-scrollbar-track{background:var(--surface2);}
.file-list::-webkit-scrollbar-thumb:hover{background:var(--accent);}
.file-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);cursor:pointer;transition:background 0.1s,border-color 0.1s;border:1px solid transparent;margin-bottom:3px;position:relative;}
.file-item:hover{background:var(--accent-light);border-color:#c8d8ef;}
.file-item.active{background:var(--accent-light);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
.file-item.prefetching::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--accent);opacity:0.4;border-radius:0 0 var(--radius) var(--radius);}
.file-icon{width:32px;height:32px;border-radius:7px;background:#e8eef7;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.file-icon svg{width:15px;height:15px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.file-item.active .file-icon{background:var(--accent);}
.file-item.active .file-icon svg{stroke:#fff;}
.file-info{flex:1;min-width:0;}
.file-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'IBM Plex Mono',monospace;color:var(--text);}
.file-meta{font-size:11px;color:var(--text-muted);display:flex;gap:8px;margin-top:2px;flex-wrap:wrap;}
.file-meta span{display:flex;align-items:center;gap:3px;}
.file-meta svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.state-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:48px 20px;color:var(--text-muted);font-size:13px;text-align:center;}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── PREVIEW ── */
.preview{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.preview-toolbar{height:48px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:8px;flex-shrink:0;}
.preview-filename{flex:1;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);font-family:'IBM Plex Mono',monospace;}
.preview-filename.empty{color:var(--text-faint);font-family:inherit;font-weight:400;font-size:13px;}
.btn{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:var(--radius);border:1px solid var(--border-strong);background:transparent;font-family:inherit;font-size:12px;font-weight:500;color:var(--text-muted);cursor:pointer;transition:background 0.1s,color 0.1s;white-space:nowrap;}
.btn:hover{background:var(--surface2);color:var(--text);}
.btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff;}
.btn:disabled{opacity:0.4;pointer-events:none;}
.preview-body{flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;}
.preview-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text-faint);text-align:center;padding:40px;}
.preview-empty svg{width:40px;height:40px;stroke:var(--border-strong);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:0.7;}
.preview-empty p{font-size:13px;max-width:200px;line-height:1.6;}
.preview-loading{display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text-muted);font-size:13px;position:absolute;inset:0;background:var(--bg);z-index:10;}
.preview-loading.show{display:flex;}
.preview-loading .spinner{width:32px;height:32px;}
.preview-progress{font-size:11px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;}
.pdf-frame{width:100%;height:100%;border:none;display:none;background:#fff;}
.pdf-frame.show{display:block;}
.preview-error{display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--danger);font-size:13px;text-align:center;padding:40px;position:absolute;inset:0;}
.preview-error.show{display:flex;}
.preview-error svg{width:36px;height:36px;stroke:var(--danger);fill:none;stroke-width:1.5;opacity:0.7;}
.stats-bar{height:32px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:16px;font-size:11px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;flex-shrink:0;}
.stats-bar span{display:flex;align-items:center;gap:4px;}
.stats-bar svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* ── CSV TAB ── */
.csv-panel{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;flex:1;min-height:0;}
.csv-toolbar{padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.csv-search{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);font-family:inherit;font-size:13px;color:var(--text);outline:none;transition:border-color 0.15s;}
.csv-search:focus{border-color:var(--accent);}
.csv-table-wrap{flex:1;overflow:auto;}
.csv-table-wrap::-webkit-scrollbar{width:10px;height:10px;}
.csv-table-wrap::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}
.csv-table-wrap::-webkit-scrollbar-track{background:var(--surface2);}
.csv-table-wrap::-webkit-scrollbar-thumb:hover{background:var(--accent);}
.csv-table{width:100%;border-collapse:collapse;font-size:12px;}
.csv-table th{background:var(--surface2);border:1px solid var(--border);padding:6px 10px;font-weight:600;white-space:nowrap;position:sticky;top:0;z-index:2;cursor:pointer;user-select:none;color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:0.04em;}
.csv-table th:hover{background:var(--accent-light);color:var(--accent);}
.csv-table th.sort-asc::after{content:' ↑';}
.csv-table th.sort-desc::after{content:' ↓';}
.csv-table td{border:1px solid var(--border);padding:6px 10px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
.csv-table tr:nth-child(even) td{background:var(--surface2);}
.csv-table tr:hover td{background:var(--accent-light);}
.csv-status{padding:12px 16px;font-size:12px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;}
.badge-da{background:var(--yes-bg);color:var(--yes);padding:1px 7px;border-radius:20px;font-size:10px;font-weight:600;}
.badge-nu{background:#fef2f2;color:var(--danger);padding:1px 7px;border-radius:20px;font-size:10px;font-weight:600;}
.badge-na{background:#f0f4f8;color:#5a7a9e;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:600;}

.csv-table th {
  position: sticky;
  top: 0;
  z-index: 2;
  overflow: visible;
}
.col-resize-handle {
  position: absolute;
  right: -10px;
  top: 0;
  bottom: 0;
  width: 20px;
  cursor: col-resize;
  user-select: none;
  background: transparent;
  z-index: 50;
  pointer-events: auto;
}
.col-resize-handle:hover {
  background: linear-gradient(to right, transparent 30%, var(--accent) 45%, var(--accent) 55%, transparent 70%);
  opacity: 0.5; 
}
.col-resize-left {
  left: -10px;
  right: auto;
}

.csv-comments-toggle{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);
  cursor:pointer;white-space:nowrap;user-select:none;
}
.csv-comments-toggle input[type="checkbox"]{
  width:15px;height:15px;cursor:pointer;accent-color:var(--accent);
}
  
/* ── PROGRESS BAR PDF ── */
.pdf-progress-bar{width:200px;height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:4px;}
.pdf-progress-fill{height:100%;background:var(--accent);width:0%;transition:width 0.2s ease;border-radius:2px;}
.pdf-progress-pct{font-size:12px;color:var(--accent);font-family:'IBM Plex Mono',monospace;font-weight:600;}

@media(max-width:680px){
  .rapoarte-layout{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);flex-shrink:0;}
  .file-list{flex:1;overflow-y:auto;}
  .preview{display:none;flex:1;min-height:0;flex-direction:column;}
  .preview.mobile-show{display:flex;}
  .sidebar.mobile-hide{display:none;}
  .topbar{padding:0 14px;}
  .csv-panel{flex-direction:column;}
  .tabs{padding:0 10px;}
  .tab{padding:8px 12px;font-size:12px;}
}

/* ── MOBILE ACTION MODAL ── */
.mob-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:500;align-items:flex-end;justify-content:center;}
.mob-modal-overlay.show{display:flex;}
.mob-modal{background:#fff;border-radius:16px 16px 0 0;padding:20px 20px 32px;width:100%;max-width:480px;box-shadow:0 -4px 24px rgba(0,0,0,0.15);}
.mob-modal-title{font-size:13px;font-weight:600;color:var(--text-muted);text-align:center;margin-bottom:4px;letter-spacing:0.04em;text-transform:uppercase;}
.mob-modal-name{font-size:14px;font-weight:600;color:var(--text);text-align:center;margin-bottom:20px;font-family:'IBM Plex Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mob-modal-actions{display:flex;flex-direction:column;gap:10px;}
.mob-modal-btn{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;color:var(--text);text-align:left;width:100%;}
.mob-modal-btn:active{background:var(--accent-light);}
.mob-modal-btn svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.mob-modal-btn-label{display:flex;flex-direction:column;}
.mob-modal-btn-label span{font-size:11px;color:var(--text-muted);font-weight:400;margin-top:1px;}
.mob-modal-cancel{margin-top:8px;width:100%;padding:13px;border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:500;color:var(--text-muted);cursor:pointer;border-radius:10px;}
.mob-modal-cancel:active{background:var(--surface2);}

  /* ── LANGUAGE SWITCHER ── */
  .lang-switcher{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,0.12);border-radius:20px;padding:3px;margin-right:4px;}
  .lang-btn{padding:3px 10px;border-radius:16px;border:none;background:transparent;color:rgba(255,255,255,0.7);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;letter-spacing:0.06em;transition:all 0.15s;}
  .lang-btn.active{background:#fff;color:var(--accent);}
  .lang-btn:hover:not(.active){color:#fff;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
      <div class="login-title" data-i18n="app_title">Rapoarte SSM</div>
    </div>
    <label class="login-label" for="emailInput" data-i18n="email_label">Email</label>
    <input class="login-input" type="email" id="emailInput" placeholder="Introduceți email..." style="margin-bottom:12px;" data-i18n-placeholder="email_placeholder" onkeydown="if(event.key==='Enter') doLogin()"/>
    <label class="login-label" for="passwordInput" data-i18n="login_label">Parolă de acces</label>
    <input class="login-input" type="password" id="passwordInput" placeholder="Introduceți parola..." data-i18n-placeholder="login_placeholder" onkeydown="if(event.key==='Enter') doLogin()"/>
    <button class="login-btn" id="loginBtn" onclick="doLogin()" data-i18n="login_btn">Login</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- APP -->
<div id="appScreen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-icon"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
      <div class="topbar-title" data-i18n="app_title">Rapoarte SSM</div>
    </div>
    <div class="topbar-right">
      <div class="lang-switcher">
        <button class="lang-btn active" id="btnLangRo" onclick="setLang('ro')">RO</button>
        <button class="lang-btn" id="btnLangEn" onclick="setLang('en')">EN</button>
      </div>
      <div class="status-pill"><div class="status-dot loading" id="statusDot"></div><span id="statusLabel">Se conectează...</span></div>
      <button class="logout-btn" onclick="doLogout()">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg data-i18n="logout">
        Logout
      </button>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <!-- Rapoarte -->
    <div class="tab active" id="tab-rapoarte" onclick="switchTab('rapoarte')">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span data-i18n="tab_rapoarte">Rapoarte</span>
    </div>
    <!-- CSV Normal -->
    <div class="tab" id="tab-csv" onclick="switchTab('csv')">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
      <span data-i18n="tab_csv">Centralizator</span>
    </div>
  </div>

  <div class="main">

    <!-- ═══ TAB: RAPOARTE NORMALE ═══ -->
    <div class="tab-content active" id="content-rapoarte">
      <div class="sidebar">
        <div class="sidebar-toolbar">

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyK8UzeO9Iel1AC9ieIS3q0-X7XBeYcFa61A5hR_6gYFdgUIXAmkKq-231KE4L-TkHsCA/exec';

// ── State rapoarte normale ──
let allFiles = [], currentFile = null, currentBlob = null, sessionToken = null;
let currentZoom = 100;
let csvSearchIndex = {}; // { "R106": "text concatenat toate coloanele rand" }

// ── State CSV ──
let csvData = [], csvHeaders = [], csvSortCol = -1, csvSortDir = 1;
let csvLoaded = false;

// ── Cache localStorage ──
const LS_PREFIX = 'ssm_pdf_';
const LS_MAX_MB = 4;
const A4_PRINT_STYLE = '<style>@page{size:A4 portrait!important;margin:1cm 1.5cm!important;}' +
                        '@media print{html,body{width:210mm!important;}}</style>';
  
// ── INIT ──
(function init() {
  var storedToken = sessionStorage.getItem('ssm_token');
  if (storedToken) { sessionToken = storedToken; showApp(); loadRapoarte(); }
  else { showLogin(); }
  // Apply saved language after DOM is ready
  setTimeout(applyLang, 0);
})();

function showLogin() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appScreen').style.display = 'none';
  setTimeout(() => document.getElementById('passwordInput').focus(), 100);
}
function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'flex';
}

async function doLogin() {
  const email = document.getElementById('emailInput').value.trim();
  const pw  = document.getElementById('passwordInput').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  if (!email || !pw) return;
  btn.disabled = true; btn.textContent = 'Se verifică...'; err.style.display = 'none';
  try {
    const res  = await fetch(GAS_URL + '?action=login&password=' + encodeURIComponent(pw) + '&email=' + encodeURIComponent(email));
    const data = await res.json();
    if (data.status === 'success') {
      sessionToken = data.token;
      sessionStorage.setItem('ssm_token', sessionToken);
      showApp(); loadRapoarte();
    } else {
      err.textContent = data.message || 'Parolă incorectă.';
      err.style.display = 'block';
      document.getElementById('passwordInput').value = '';
      document.getElementById('passwordInput').focus();
    }
  } catch(e) { err.textContent = 'Eroare conexiune.'; err.style.display = 'block'; }
  btn.disabled = false; btn.textContent = 'Intră';
}

function doLogout() {
  sessionStorage.removeItem('ssm_token');
  sessionToken = null; allFiles = []; allTestFiles = [];
  currentFile = null; currentBlob = null;
  document.getElementById('passwordInput').value = '';
  showLogin();
}

// ── TABS ──
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('content-' + tab).classList.add('active');
  if (tab === 'csv' && !csvLoaded) { loadCsv(); }
}

// ═══════════════════════════════════════════════
// RAPOARTE NORMALE
// ═══════════════════════════════════════════════
async function loadRapoarte() {
  setStatus('loading', 'Se conectează...');
  try {
    // ── Încărcăm lista de fișiere și CSV-ul în paralel ──
    const [resFiles, resCsv] = await Promise.all([
      fetch(GAS_URL + '?action=rapoarte&token=' + encodeURIComponent(sessionToken)),
      fetch(GAS_URL + '?action=csv&token=' + encodeURIComponent(sessionToken))
    ]);

    const dataFiles = await resFiles.json();
    if (dataFiles.status === 'error' && dataFiles.message === 'Neautorizat.') { doLogout(); return; }
    if (dataFiles.status !== 'success') throw new Error(dataFiles.message || 'Eroare server');

    // ── Construim map nr → locatie din CSV ──
    var locatieMap = {};
    try {
    const dataCsv = await resCsv.json();
    if (dataCsv.status === 'success' && dataCsv.csv) {
      const rows = parseCSV(dataCsv.csv);
      if (rows.length >= 2) {
        const header = rows[0];
        const idxNr  = header.indexOf('Nr Raport');
        const idxLoc = header.indexOf('Locatie');
        csvSearchIndex = {};
        if (idxNr !== -1) {
          rows.slice(1).forEach(function(row) {
            var nr = (row[idxNr] || '').trim();
            if (nr) csvSearchIndex[nr.toUpperCase()] = row.join(' ');
          });
        }
        if (idxNr !== -1 && idxLoc !== -1) {
          rows.slice(1).forEach(function(row) {
            var nr  = (row[idxNr]  || '').trim();
            var loc = (row[idxLoc] || '').trim();
            if (nr) locatieMap[nr] = loc;
          });
        }
      }
    }
  } catch(e) { console.warn('CSV locatie load error:', e); }

    // ── Adăugăm locatie la fiecare fișier ──
    // ── Adăugăm locatie la fiecare fișier ──
    allFiles = (dataFiles.files || []).map(function(f) {
      f.locatie = locatieMap[f.nr] || '';
      return f;
    });

    // ── Golim cache-ul la fiecare refresh ──
    try {
      var keysToDelete = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && (k.startsWith(LS_PREFIX))) {
          keysToDelete.push(k);
        }
      }
      keysToDelete.forEach(function(k) { localStorage.removeItem(k); });
    } catch(e) {}

    setStatus('ok', allFiles.length + ' ' + t('count_reports'));
    filterFiles();

  } catch(e) {
    setStatus('error', 'Eroare conexiune');
    document.getElementById('fileList').innerHTML = '<div class="state-msg"><span style="color:#c0392b">' + t('load_error') + '</span></div>';
  }
}

function setStatus(type, label) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (type === 'loading' ? ' loading' : type === 'error' ? ' error' : '');
  document.getElementById('statusLabel').textContent = label;
}

function formatDate(d) { if (!d) return '—'; const p = d.split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : d; }

function filterFiles() {
  const q    = document.getElementById('searchInput').value.trim();
  const sort = document.getElementById('sortSelect').value;
  let list = allFiles.filter(f => {
    if (!q) { f._matchedByContent = false; return true; }
    var matchesMeta = matchesWholeWord(f.name, q) ||
                       matchesWholeWord(f.location, q) ||
                       matchesWholeWord(f.nr, q) ||
                       matchesWholeWord(f.date, q) ||
                       matchesWholeWord(f.locatie, q);
    if (matchesMeta) { f._matchedByContent = false; return true; }
    var nrKey = (f.nr||'').toUpperCase();
    var content = csvSearchIndex[nrKey];
    var matchesContent = content ? matchesWholeWord(content, q) : false;
    f._matchedByContent = matchesContent;
    return matchesContent;
  });
  const getNr = f => parseInt((f.nr||'').replace(/[^0-9]/g,'')) || 0;
  if (sort === 'nr_asc') list.sort((a,b) => getNr(a) - getNr(b));
  else if (sort === 'nr_desc') list.sort((a,b) => getNr(b) - getNr(a));
  document.getElementById('countBadge').textContent = list.length + ' / ' + allFiles.length + ' ' + t('count_reports');
  renderList(list);
}
function renderList(files) {
  const el     = document.getElementById('fileList');
  const active = currentFile;
  if (!files.length) {
    el.innerHTML = '<div class="state-msg"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#b8b5ac" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>' + t('no_reports') + '</span></div>';
    return;
  }
  el.innerHTML = files.map(f => {
    const cached    = isCached(f.name);
    const activeCls = (active && active.name === f.name) ? ' active' : '';
    const fJson     = JSON.stringify(f).replace(/"/g, '&quot;');
    return '<div class="file-item' + activeCls + '"'
      + ' data-fname="' + f.name.replace(/"/g, '&quot;') + '"'
      + ' onclick="selectFile(' + fJson + ')"'
      + ' onpointerdown="handlePrefetchDown(this)"'
      + ' onmouseenter="handlePrefetchDown(this)">'
      + '<div class="file-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>'
      + '<div class="file-info">'
      + '<div class="file-name">' + f.name + (cached ? ' <span style="font-size:9px;color:var(--yes);">●</span>' : '') + (f._matchedByContent ? ' <span style="font-size:9px;color:var(--accent);" title="Găsit în conținutul raportului">🔍</span>' : '') + '</div>'
      + '<div class="file-meta">'
      + '<span><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' + formatDate(f.date) + '</span>'
      + (f.location ? '<span><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' + f.location + '</span>' : '')
      + (f.locatie ? '<span><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>' + f.locatie + '</span>' : '')
      + '</div></div></div>';
  }).join('');
}

function selectFile(f) {
  currentFile = f; currentBlob = null; currentZoom = 100;
  document.getElementById('previewFilename').textContent = f.name;
  document.getElementById('previewFilename').className = 'preview-filename';
  document.getElementById('btnDownload').disabled = false;
  document.getElementById('btnZoomIn').disabled = false;
  document.getElementById('btnZoomOut').disabled = false;
  document.getElementById('btnZoomReset').disabled = false;
  document.getElementById('zoomLevel').textContent = '100%';
  document.getElementById('statName').textContent = f.nr || f.name;
  document.getElementById('statDate').textContent = formatDate(f.date);
  document.getElementById('statLocation').textContent = f.location || '—';
  document.getElementById('statLocatie').textContent = f.locatie || '—';
  document.getElementById('statsBar').style.display = 'flex';
  filterFiles();
  if (isMobileDevice()) {
    window._mobHtml = null;
    document.getElementById('mobModalName').textContent = f.name;
    document.getElementById('mobModal').classList.add('show');
    var cached = loadFromCache(f.name);
    if (cached) {
      window._mobHtml = cached;
    } else {
      fetchHTMLFor(f.name).then(function(html) {
        if (html) { saveToCache(f.name, html); window._mobHtml = html; }
      });
    }
  } else {
    mobileShowPreview();
    previewCurrent();
  }
}

function showPreviewState(state) {
  document.getElementById('previewEmpty').style.display = state === 'empty' ? 'flex' : 'none';
  document.getElementById('previewLoading').className = 'preview-loading' + (state === 'loading' ? ' show' : '');
  document.getElementById('previewError').className = 'preview-error' + (state === 'error' ? ' show' : '');
}

function zoomPreview(delta) {
  const frame = document.getElementById('pdfFrame');
  if (!frame.srcdoc && !frame.src) return;
  if (delta === 0) { currentZoom = 100; }
  else { currentZoom = Math.min(300, Math.max(50, currentZoom + delta)); }
  document.getElementById('zoomLevel').textContent = currentZoom + '%';
  try { const b = frame.contentDocument && frame.contentDocument.body; if (b) b.style.zoom = (currentZoom / 100); } catch(e) {}
}

async function previewCurrent() {
  if (!currentFile) return;
  if (currentBlob) { showHtmlPreview(currentBlob); return; }
  const cached = loadFromCache(currentFile.name);
  if (cached) { currentBlob = cached; showHtmlPreview(cached); return; }
  showPreviewState('loading');
  document.getElementById('previewProgress').textContent = currentFile.name;
  document.getElementById('previewProgressPct').textContent = '0%';
  document.getElementById('progressFill').style.width = '0%';
  let simPct = 0;
  const sim = setInterval(() => {
    simPct += (85 - simPct) * 0.15;
    const pct = Math.round(simPct);
    document.getElementById('previewProgressPct').textContent = pct + '%';
    document.getElementById('progressFill').style.width = pct + '%';
  }, 100);
  try {
    const html = await fetchHTMLFor(currentFile.name);
    clearInterval(sim);
    document.getElementById('previewProgressPct').textContent = '100%';
    document.getElementById('progressFill').style.width = '100%';
    if (!html) throw new Error('Fișier HTML indisponibil');
    saveToCache(currentFile.name, html);
    currentBlob = html;
    showHtmlPreview(html);
    filterFiles();
  } catch(e) {
    clearInterval(sim);
    showPreviewState('error');
    document.getElementById('previewErrorMsg').textContent = 'Eroare: ' + (e.message || 'necunoscută');
  }
}

function showHtmlPreview(html) {
  const frame = document.getElementById('pdfFrame');
  const zoom  = currentZoom;
  const file  = currentFile;

  if (isMobileDevice()) {
    window._mobHtml = html;
    var fname = file ? file.name : 'Raport';
    document.getElementById('mobModalName').textContent = fname;
    document.getElementById('mobModal').classList.add('show');
    mobileBackToList();
  } else {
    const title    = file ? file.name.replace(/\.[^.]+$/, '') : 'Raport SSM';
    const titleTag = '<title>' + title + '</title>';
    let htmlT = html.replace(/<title[^>]*>[\s\S]*?<\/title>/i, titleTag);
    if (!htmlT.includes(titleTag)) htmlT = htmlT.replace(/<head>/i, '<head>' + titleTag);
    htmlT = htmlT.replace('</head>', A4_PRINT_STYLE + '</head>');
    frame.srcdoc    = htmlT;
    frame.className = 'pdf-frame show';
    showPreviewState(null);
    if (zoom !== 100) {
      frame.onload = function() {
        try { frame.contentDocument.body.style.zoom = (zoom / 100); } catch(ex) {}
      };
    }
  }
}

function downloadCurrent() {
  if (!currentFile) return;
  const fileName = currentFile.name.replace(/\.[^.]+$/, '');
  const frame = document.getElementById('pdfFrame');

  function doPrint() {
    // Setăm titlul în iframe direct — browserul îl folosește ca nume fișier
    try {
      frame.contentDocument.title = fileName;
    } catch(e) {}
    const orig = document.title;
    document.title = fileName;
    frame.contentWindow.focus();
    frame.contentWindow.print();
    setTimeout(function() { document.title = orig; }, 2000);
  }

  // Dacă iframe-ul are deja raportul încărcat — printăm direct
  if (frame.srcdoc && currentBlob) {
    doPrint();
    return;
  }

  // Altfel încărcăm mai întâi în preview, apoi printăm
  previewCurrent().then(function() {
    setTimeout(doPrint, 600);
  });
}
  
// ── Cache helpers ──
function getCacheKey(filename) {
  var langPrefix = (currentLang === 'en') ? 'en_' : '';
  return LS_PREFIX + langPrefix + filename;
}

function isCached(filename) {
  try { return !!localStorage.getItem(getCacheKey(filename)); } catch(e) { return false; }
}

function saveToCache(filename, content) {
  try {
    const key = getCacheKey(filename);
    const sizeMB = (content.length * 0.75) / (1024 * 1024);
    let totalMB = 0;
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(LS_PREFIX)) {
        const v = localStorage.getItem(k);
        totalMB += (v.length * 0.75) / (1024 * 1024);
        keys.push({ k, size: (v.length * 0.75) / (1024 * 1024) });
      }
    }
    while (totalMB + sizeMB > LS_MAX_MB && keys.length > 0) {
      const oldest = keys.shift();
      localStorage.removeItem(oldest.k);
      totalMB -= oldest.size;
    }
    localStorage.setItem(key, content);
  } catch(e) {}
}

function loadFromCache(filename) {
  try { return localStorage.getItem(getCacheKey(filename)); } catch(e) { return null; }
}

// ── fetchHTML parametrizat ──
async function fetchHTMLFor(filename) {
  var folderParam = (currentLang === 'en') ? '&folder=rapoarte_raw_EN' : '';
  const url = GAS_URL + '?action=html&filename=' + encodeURIComponent(filename) +
              folderParam + '&token=' + encodeURIComponent(sessionToken);
  const res = await fetch(url);
  if (!res.ok) return null;
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch(e) { return null; }
  if (data.status === 'error' && data.message === 'Neautorizat.') { doLogout(); return null; }
  if (data.status !== 'success') return null;
  return data.html;
}

// ── Prefetch ──
let prefetching = new Set(), prefetchingTest = new Set();

function handlePrefetchDown(el) {
  // prefetch dezactivat
}

// CSV NORMAL
// ═══════════════════════════════════════════════
async function loadCsv() {
  document.getElementById('csvTableWrap').innerHTML = '<div class="state-msg"><div class="spinner"></div><span>' + t('loading_csv') + '</span></div>';
  document.getElementById('csvStatus').textContent = '';
  document.getElementById('csvCountBadge').textContent = '';
  try {
    const res  = await fetch(GAS_URL + '?action=csv&token=' + encodeURIComponent(sessionToken));
    const data = await res.json();
    if (data.status === 'error' && data.message === 'Neautorizat.') { doLogout(); return; }
    if (data.status !== 'success') throw new Error(data.message || 'Eroare server');
    const rows = parseCSV(data.csv);
    if (rows.length < 2) { document.getElementById('csvTableWrap').innerHTML = '<div class="state-msg"><span>' + t('csv_empty') + '</span></div>'; return; }
    csvHeaders = rows[0]; csvData = rows.slice(1);
    csvLoaded  = true;
    renderCsvFor(csvData, csvHeaders);
    document.getElementById('csvStatus').textContent = csvData.length + ' ' + t('records') + ' · ' + csvHeaders.length + ' ' + t('columns');
    document.getElementById('csvCountBadge').textContent = csvData.length + ' ' + t('rows');
    document.getElementById('btnExportCsv').disabled = false;
  } catch(e) {
    document.getElementById('csvTableWrap').innerHTML = '<div class="state-msg"><span style="color:#c0392b">Eroare la încărcarea CSV-ului: ' + (e.message||'necunoscută') + '</span></div>';
  }
}

function stripDiacritics(s) {
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function matchesWholeWord(text, query) {
  if (!query) return true;
  if (!text) return false;
  var normText  = stripDiacritics(text).toLowerCase();
  var normQuery = stripDiacritics(query).toLowerCase();
  var escaped = normQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  var re = new RegExp('\\b' + escaped + '\\b', 'i');
  return re.test(normText);
}

function parseCSV(text) {
  const rows = [];
  let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') {
      if (inQ && text[i+1] === '"') { cur += '"'; i++; }
      else { inQ = !inQ; }
    } else if (c === ',' && !inQ) {
      row.push(cur); cur = '';
    } else if ((c === '\n' || c === '\r') && !inQ) {
      if (c === '\r' && text[i+1] === '\n') i++; // skip \r\n pair
      row.push(cur); cur = '';
      if (row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    } else {
      cur += c;
    }
  }
  if (cur !== '' || row.length > 0) { row.push(cur); rows.push(row); }
  return rows;
}

function filterCsv() {
  const q        = document.getElementById('csvSearch').value.trim();
  const filtered = q ? csvData.filter(r => r.some(c => matchesWholeWord(c, q))) : csvData;
  renderCsvFor(filtered, csvHeaders);
  document.getElementById('csvCountBadge').textContent = filtered.length + ' / ' + csvData.length + ' ' + t('rows');
}
  
let showComments = false;

function isCommentColumn(headerName) {
  return (headerName || '').toUpperCase().includes('COMENTARIU');
}

function isAnswerColumn(headerName) {
  var h = (headerName || '');
  // Coloanele "Raspuns" sunt cele de tip "1.1 - text intrebare..." sau "14.1 - text..." (NU comentariu, NU meta)
  return /^\d+\.\d+\s*-/.test(h.trim());
}
  
function onToggleComments() {
  showComments = document.getElementById('toggleComments').checked;
  const q = document.getElementById('csvSearch').value.trim();
  const filtered = q ? csvData.filter(r => r.some(c => matchesWholeWord(c, q))) : csvData;
  renderCsvFor(filtered, csvHeaders);
}

function renderCsvFor(rows, headers) {
  const wrap = document.getElementById('csvTableWrap');
  if (!rows.length) { wrap.innerHTML = '<div class="state-msg"><span>' + (currentLang === 'en' ? 'No results.' : 'Niciun rezultat.') + '</span></div>'; return; }

  const visibleIdx = headers.map((h, i) => i).filter(i => showComments || !isCommentColumn(headers[i]));

   let html = '<table class="csv-table"><thead><tr>';
    visibleIdx.forEach(i => {
    const h = headers[i];
    const cls = csvSortCol === i ? (csvSortDir === 1 ? 'sort-asc' : 'sort-desc') : '';
    var handleHtml = (i > 0)
      ? '<div class="col-resize-handle col-resize-left" onclick="event.stopPropagation()" onmousedown="initColResize(event,this,-1)" ondblclick="event.stopPropagation();autoFitColumn(this,-1)"></div>'
      : '';
    var isAnswerCol = isAnswerColumn(h);
    var styleAttr = isAnswerCol ? ' style="width:64px;min-width:64px;max-width:64px;"' : '';
    html += '<th class="' + cls + '"' + styleAttr + ' onclick="sortCsvFor(' + i + ')">' +
            handleHtml + h +
            '<div class="col-resize-handle" onclick="event.stopPropagation()" onmousedown="initColResize(event,this,1)" ondblclick="event.stopPropagation();autoFitColumn(this,1)"></div></th>';
  });
  html += '</tr></thead><tbody>';
  rows.forEach(row => {
    html += '<tr>';
    visibleIdx.forEach(i => {
      const val = row[i] || '';
      let display = val;
      if (val === 'DA') display = '<span class="badge-da">DA</span>';
      else if (val === 'NU') display = '<span class="badge-nu">NU</span>';
      else if (val === 'N/A') display = '<span class="badge-na">N/A</span>';
      html += '<td title="' + val.replace(/"/g,'&quot;') + '">' + display + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function sortCsvFor(colIdx) {
  if (csvSortCol === colIdx) { csvSortDir *= -1; } else { csvSortCol = colIdx; csvSortDir = 1; }
  const q   = document.getElementById('csvSearch').value.trim();
  let rows  = q ? csvData.filter(r => r.some(c => matchesWholeWord(c, q))) : csvData;
  rows = [...rows].sort((a,b) => (a[colIdx]||'').localeCompare(b[colIdx]||'', undefined, {numeric:true}) * csvSortDir);
  renderCsvFor(rows, csvHeaders);
}

  function initColResize(e, handle, dir) {
  e.preventDefault();
  e.stopPropagation();
  // Handle-ul mereu redimensionează coloana din STÂNGA lui
  var th = (dir === -1) ? handle.parentElement.previousElementSibling : handle.parentElement;
  if (!th) return;
  var startX = e.clientX;
  var startW = th.offsetWidth;

  function onMove(e) {
    var newW = Math.max(40, startW + (e.clientX - startX));
    th.style.width = newW + 'px';
    th.style.minWidth = newW + 'px';
    th.style.maxWidth = newW + 'px';
  }

  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  }

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function autoFitColumn(handle, dir) {
  var th = (dir === -1) ? handle.parentElement.previousElementSibling : handle.parentElement;
  if (!th) return;
  var table = th.closest('table');
  var colIdx = Array.from(th.parentElement.children).indexOf(th);

  // Măsurăm lățimea reală folosind un element DOM clonat, invizibil, fără constrângeri de lățime
  var measurer = document.createElement('div');
  measurer.style.position = 'absolute';
  measurer.style.visibility = 'hidden';
  measurer.style.whiteSpace = 'nowrap';
  measurer.style.left = '-9999px';
  measurer.style.top = '0';
  document.body.appendChild(measurer);

  var thStyle = window.getComputedStyle(th);
  measurer.style.font = thStyle.font;
  measurer.style.fontWeight = thStyle.fontWeight;
  measurer.style.fontSize = thStyle.fontSize;
  measurer.style.fontFamily = thStyle.fontFamily;
  measurer.style.letterSpacing = thStyle.letterSpacing;
  measurer.style.textTransform = thStyle.textTransform;
  measurer.textContent = th.textContent.trim();
  var maxWidth = measurer.offsetWidth;

  var rows = table.querySelectorAll('tbody tr');
  rows.forEach(function(row) {
    var cell = row.children[colIdx];
    if (!cell) return;
    var cellStyle = window.getComputedStyle(cell);
    measurer.style.fontWeight = cellStyle.fontWeight;
    measurer.style.fontSize = cellStyle.fontSize;
    measurer.style.fontFamily = cellStyle.fontFamily;
    measurer.style.letterSpacing = cellStyle.letterSpacing;
    measurer.style.textTransform = cellStyle.textTransform;
    var text = cell.getAttribute('title') || cell.textContent || '';
    measurer.textContent = text.trim();
    var w = measurer.offsetWidth;
    if (w > maxWidth) maxWidth = w;
  });

  document.body.removeChild(measurer);

  // Adăugăm padding-ul celulei (stânga + dreapta) + o marjă de siguranță
  var newW = Math.ceil(maxWidth) + 28;
  newW = Math.max(40, newW);

  th.style.width = newW + 'px';
  th.style.minWidth = newW + 'px';
  th.style.maxWidth = newW + 'px';
}

function isMobileView() { return window.innerWidth <= 680; }

function isMobileDevice() {
  return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
}
  
function mobileShowPreview() {
  if (!isMobileView()) return;
  const container = document.getElementById('content-rapoarte');
  if (!container) return;
  const sidebar = container.querySelector('.sidebar');
  const preview = container.querySelector('.preview');
  if (sidebar) sidebar.classList.add('mobile-hide');
  if (preview) preview.classList.add('mobile-show');
}

  const container = document.getElementById('content-rapoarte');
  if (!container) return;
  const sidebar = container.querySelector('.sidebar');
  const preview = container.querySelector('.preview');
  if (sidebar) sidebar.classList.remove('mobile-hide');

}
  
// ── Mobile modal ──
function closeMobModal(e) {
  if (e && e.target !== document.getElementById('mobModal')) return;
  document.getElementById('mobModal').classList.remove('show');
}

function mobActionView() {
  document.getElementById('mobModal').classList.remove('show');
  if (!window._mobHtml) {
    // HTML încă se descarcă — așteptăm
    var dots = 0;
    var checking = setInterval(function() {
      if (window._mobHtml) {
        clearInterval(checking);
        _mobOpenUrl(window._mobHtml, false);
      } else {
        dots = (dots + 1) % 4;
        // reshow modal cu mesaj
        document.getElementById('mobModalName').textContent = 'Se încarcă' + '.'.repeat(dots + 1);
        document.getElementById('mobModal').classList.add('show');
      }
    }, 400);
    return;
  }
  _mobOpenUrl(window._mobHtml, false);
}

function mobActionDownload() {
  document.getElementById('mobModal').classList.remove('show');
  if (!window._mobHtml) {
    var dots = 0;
    var checking = setInterval(function() {
      if (window._mobHtml) {
        clearInterval(checking);
        _mobOpenUrl(window._mobHtml, true);
      } else {
        dots = (dots + 1) % 4;
        document.getElementById('mobModalName').textContent = 'Se încarcă' + '.'.repeat(dots + 1);
        document.getElementById('mobModal').classList.add('show');
      }
    }, 400);
    return;
  }
  _mobOpenUrl(window._mobHtml, true);
}

function _mobOpenUrl(html, print) {
  var fileName = (currentFile ? currentFile.name.replace(/\.[^.]+$/, '') : 'Raport');
  var htmlWithTitle = html.replace(
    /<title[^>]*>[\s\S]*?<\/title>/i,
    '<title>' + fileName + '</title>'
  );
  var w = window.open('', '_blank');
  if (!w) { alert('Permite popup-uri pentru acest site și încearcă din nou.'); return; }
  var htmlA4 = htmlWithTitle.replace('</head>', A4_PRINT_STYLE + '</head>');
  if (htmlA4 === htmlWithTitle) htmlA4 = A4_PRINT_STYLE + htmlWithTitle;
  w.document.open();
  w.document.write(htmlA4);
  w.document.close();
  if (print) {
    w.onload = function() {
      setTimeout(function() { try { w.print(); } catch(ex) {} }, 400);
    };
    setTimeout(function() { try { w.print(); } catch(ex) {} }, 1200);
  }
}

function exportCsv() {
  if (!csvHeaders.length || !csvData.length) return;
  function escVal(v) {
    const s = String(v||'').replace(/"/g, '""');
    return (s.includes(',') || s.includes('"') || s.includes('\n')) ? '"' + s + '"' : s;
  }
  const lines = [csvHeaders.map(escVal).join(',')];
  csvData.forEach(row => lines.push(row.map(escVal).join(',')));
  const blob = new Blob(['\uFEFF' + lines.join('\n')], {type: 'text/csv;charset=utf-8;'});
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = 'centralizator_SSM_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

var currentLang = 'ro';

function t(key) {
  return (I18N[currentLang] && I18N[currentLang][key]) || (I18N['ro'][key]) || key;
}

function applyLang() {
  // Text content
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.getAttribute('data-i18n');
    el.textContent = t(key);
  });
  // Placeholders
  document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
    el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
  });
  // Titles
  document.querySelectorAll('[data-i18n-title]').forEach(function(el) {
    el.title = t(el.getAttribute('data-i18n-title'));
  });
  // Traduce opțiunile din select-uri
  document.querySelectorAll('option[data-i18n]').forEach(function(el) {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  // Update lang buttons
  var btnRo = document.getElementById('btnLangRo');
  var btnEn = document.getElementById('btnLangEn');
  if (btnRo) btnRo.classList.toggle('active', currentLang === 'ro');
  if (btnEn) btnEn.classList.toggle('active', currentLang === 'en');
  // Update document title
  document.title = t('app_title');
  // Update status label if it shows connecting
  var statusLabel = document.getElementById('statusLabel');
  if (statusLabel && statusLabel.textContent === I18N['ro']['connecting'] || 
      statusLabel && statusLabel.textContent === I18N['en']['connecting']) {
    statusLabel.textContent = t('connecting');
  }
}

function setLang(lang) {
  if (currentLang === lang) return;
  currentLang = lang;
  try { localStorage.setItem('ssm_lang', lang); } catch(e) {}
  applyLang();
  // La schimbarea limbii, resetăm blob-ul curent și reîncărcăm din folderul corect
  currentBlob = null;
  if (currentFile) {
    // Ștergem cache-ul pentru fișierul curent din ambele limbi
    try {
      localStorage.removeItem(LS_PREFIX + currentFile.name);
    } catch(e) {}
    previewCurrent();
  }
}
